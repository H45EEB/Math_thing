<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Number Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EE;
  --paper-2:#FFFFFF;
  --ink:#182B2E;
  --ink-soft:#4A5D5F;
  --line:#C9D3CB;
  --teal:#1F5C52;
  --amber:#D98E2B;
  --brick:#B8443B;
  --violet:#5B4B8A;
  --good:#2D8659;
  --shadow: 0 1px 0 rgba(24,43,46,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--paper) 0, var(--paper) 100%);
  background-color:var(--paper);
  background-image:
    linear-gradient(rgba(24,43,46,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,43,46,0.045) 1px, transparent 1px);
  background-size: 28px 28px;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'Space Mono',monospace;}
#app{max-width:920px;margin:0 auto;padding:clamp(18px,5vw,32px) clamp(14px,4vw,20px) clamp(40px,8vw,80px);}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;gap:12px;flex-wrap:wrap;}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(21px,5.5vw,28px);letter-spacing:-0.01em;}
.brand span{color:var(--teal);}
.tagline{color:var(--ink-soft);font-size:clamp(12.5px,3vw,14px);margin-top:2px;}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
.overall-track{width:clamp(70px,20vw,120px);height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex-shrink:0;}
.overall-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .5s ease;}

/* ---------- path / map ---------- */
.path-wrap{margin-top:36px;position:relative;}
.path-svg{width:100%;display:block;}
.node{cursor:pointer;}
.node:hover .node-circle{filter:brightness(1.05);}
.node-circle{transition:transform .15s ease;}
.node:hover .node-circle{transform:scale(1.03);transform-origin:center;}
.node.locked{cursor:not-allowed;}
.node-label{font-family:'Fraunces',serif;font-weight:600;}
.node-sub{font-family:'Inter',sans-serif;}

/* ---------- stage screen ---------- */
.stage-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.back-btn{
  background:var(--paper-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  box-shadow:var(--shadow);flex-shrink:0;
}
.back-btn:hover{border-color:var(--teal);}
.stage-title{font-size:clamp(18px,4.5vw,24px);font-weight:600;flex:1;min-width:120px;}
.level-pips{display:flex;gap:6px;flex-wrap:wrap;}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'Space Mono',monospace;color:var(--ink-soft);background:var(--paper-2);flex-shrink:0;}
.pip.done{background:var(--good);border-color:var(--good);color:white;}
.pip.active{border-color:var(--amber);color:var(--ink);font-weight:700;}

.panel{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,22px) clamp(14px,4vw,24px);box-shadow:var(--shadow);margin-bottom:18px;}
.lesson-title{font-size:15px;text-transform:none;color:var(--teal);font-weight:700;margin:0 0 8px;letter-spacing:0.01em;}
.lesson-body{font-size:15px;line-height:1.6;color:var(--ink);}
.lesson-body code{font-family:'Space Mono',monospace;background:var(--paper);padding:1px 5px;border-radius:4px;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0;}

.problem-count{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.prompt{font-family:'Space Mono',monospace;font-size:clamp(19px,5.5vw,26px);margin:6px 0 18px;line-height:1.5;word-break:break-word;}
.prompt .hl-paren{color:var(--violet);}
.prompt .hl-md{color:var(--amber);}
.prompt .hl-as{color:var(--teal);}

.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.answer-input{
  font-family:'Space Mono',monospace;font-size:18px;padding:10px 12px;border:2px solid var(--line);
  border-radius:8px;flex:1 1 150px;min-width:0;max-width:220px;background:var(--paper);color:var(--ink);
}
.answer-input:focus{outline:none;border-color:var(--teal);}
.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;
  border:none;cursor:pointer;background:var(--teal);color:white;white-space:nowrap;
}
.btn:hover{background:#164841;}
.btn.secondary{background:transparent;color:var(--teal);border:1px solid var(--teal);}
.btn.secondary:hover{background:rgba(31,92,82,0.08);}
.btn:disabled{opacity:0.45;cursor:default;}

.choices{display:flex;gap:10px;flex-wrap:wrap;}
.choice-btn{
  font-family:'Space Mono',monospace;font-size:16px;padding:10px 16px;border-radius:8px;border:2px solid var(--line);
  background:var(--paper);cursor:pointer;color:var(--ink);
}
.choice-btn:hover{border-color:var(--teal);}
.choice-btn.correct{background:rgba(45,134,89,0.15);border-color:var(--good);}
.choice-btn.wrong{background:rgba(184,68,59,0.15);border-color:var(--brick);}

.feedback{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;display:none;}
.feedback.show{display:block;}
.feedback.correct{background:rgba(45,134,89,0.12);color:#1c5c3e;border:1px solid rgba(45,134,89,0.35);}
.feedback.wrong{background:rgba(184,68,59,0.10);color:#8f342c;border:1px solid rgba(184,68,59,0.3);}
.steps{margin-top:10px;font-family:'Space Mono',monospace;font-size:14px;line-height:1.9;}
.steps .step{display:block;}
.steps .step .tag{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:8px;color:white;display:inline-block;margin-bottom:2px;}
.tag.paren{background:var(--violet);} .tag.md{background:var(--amber);} .tag.as{background:var(--teal);}

.visual-box{display:flex;justify-content:center;margin:6px 0 16px;}
.visual-box svg{max-width:100%;height:auto;}

.streak-row{display:flex;align-items:center;gap:14px;margin-top:16px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
.streak-track{width:clamp(90px,30vw,160px);height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex-shrink:0;}
.streak-fill{height:100%;background:var(--amber);transition:width .3s ease;}
.streak-fire{font-size:13px;flex-shrink:0;}

.mastery-banner{
  background:linear-gradient(120deg, rgba(217,142,43,0.15), rgba(31,92,82,0.15));
  border:1px solid var(--amber);border-radius:14px;padding:clamp(16px,5vw,22px);text-align:center;margin-top:10px;
}
.mastery-banner h2{margin:0 0 6px;font-size:clamp(18px,5vw,22px);}
.mastery-banner p{margin:0 0 14px;color:var(--ink-soft);font-size:14px;}

footer.note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:40px;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

/* ---------- responsive breakpoints ---------- */
@media (max-width:600px){
  .stage-title{order:-1;width:100%;flex:1 1 100%;}
  .level-pips{width:100%;}
  .pip{width:24px;height:24px;font-size:12px;}
  .btn{padding:11px 16px;font-size:14.5px;}
  .choice-btn{padding:11px 15px;}
  .answer-input{flex-basis:100%;max-width:none;font-size:17px;}
  #check-btn,#skip-btn{flex:1 1 auto;}
}
@media (max-width:400px){
  .brand{letter-spacing:-0.02em;}
  .top{gap:10px;}
  .panel{margin-bottom:14px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   THE NUMBER WORKSHOP — core math utilities
   ============================================================ */

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}

class Frac{
  constructor(n,d=1){
    if(d<0){n=-n;d=-d;}
    const g=gcd(n,d)||1;
    this.n=n/g; this.d=d/g;
  }
  add(o){return new Frac(this.n*o.d+o.n*this.d, this.d*o.d);}
  sub(o){return new Frac(this.n*o.d-o.n*this.d, this.d*o.d);}
  mul(o){return new Frac(this.n*o.n, this.d*o.d);}
  div(o){return new Frac(this.n*o.d, this.d*o.n);}
  neg(){return new Frac(-this.n,this.d);}
  toFloat(){return this.n/this.d;}
  equals(o){return this.n===o.n && this.d===o.d;}
  isInt(){return this.d===1;}
  toString(){ if(this.d===1) return String(this.n); return `${this.n}/${this.d}`; }
  toMixedString(){
    if(this.d===1) return String(this.n);
    const sign = this.n<0 ? -1:1; const an=Math.abs(this.n);
    const whole = Math.floor(an/this.d);
    const rem = an%this.d;
    if(whole===0) return `${sign<0?'-':''}${an}/${this.d}`;
    if(rem===0) return String(sign*whole);
    return `${sign<0?'-':''}${whole} ${rem}/${this.d}`;
  }
}
function F(n,d=1){return new Frac(n,d);}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];} return a;}

/* Parse a user-entered answer like "3", "-2", "3/4", "-1 1/2", "x=5", "x = -3" into a Frac or null */
function parseAnswer(str){
  if(str==null) return null;
  let s = str.trim().toLowerCase();
  s = s.replace(/^x\s*=\s*/,'');
  s = s.replace(/\s+/g,' ').trim();
  if(s==='') return null;
  // mixed number: "-1 1/2" or "1 1/2"
  let m = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(m){
    const whole=parseInt(m[1],10), n=parseInt(m[2],10), d=parseInt(m[3],10);
    const sign = whole<0 || Object.is(whole,-0) ? -1:1;
    return F(sign*(Math.abs(whole)*d+n), d);
  }
  m = s.match(/^(-?\d+)\/(\d+)$/);
  if(m) return F(parseInt(m[1],10), parseInt(m[2],10));
  m = s.match(/^-?\d+(\.\d+)?$/);
  if(m){
    if(s.indexOf('.')>=0){
      const parts=s.split('.'); const decLen=parts[1].length;
      const denom=Math.pow(10,decLen);
      return F(Math.round(parseFloat(s)*denom), denom);
    }
    return F(parseInt(s,10),1);
  }
  return null;
}

/* ============================================================
   EXPRESSION TREE — used for BODMAS and Fractions+BODMAS
   node: {type:'num', val:Frac} or {type:'op', op:'+'|'-'|'*'|'/'|'^', left, right, paren:bool}
   ============================================================ */
const PREC = {'+':1,'-':1,'*':2,'/':2,'^':3};
const OPSYM = {'+':'+','-':'−','*':'×','/':'÷','^':'^'};

function evalTree(node, steps){
  if(node.type==='num') return node.val;
  const l = evalTree(node.left, steps);
  const r = evalTree(node.right, steps);
  let res;
  if(node.op==='+') res=l.add(r);
  else if(node.op==='-') res=l.sub(r);
  else if(node.op==='*') res=l.mul(r);
  else if(node.op==='/') res=l.div(r);
  else if(node.op==='^'){ // r is always a small positive integer Frac here
    let base=l, val=F(1);
    const p = r.n;
    for(let i=0;i<p;i++) val=val.mul(base);
    res=val;
  }
  const cls = node.op==='^' ? 'paren' : (PREC[node.op]===2 ? 'md' : 'as');
  steps.push({left:l.toMixedString(), op:OPSYM[node.op], right:r.toMixedString(), result:res.toMixedString(), cls});
  return res;
}

function renderInfix(node, parentPrec, isRightChildOfSamePrec){
  if(node.type==='num'){
    const s = node.val.toMixedString();
    return {text:s, cls:'num'};
  }
  const myPrec = PREC[node.op];
  const l = renderInfix(node.left, myPrec, false);
  const r = renderInfix(node.right, myPrec, true);
  const cls = node.op==='^' ? 'hl-paren' : (myPrec===2 ? 'hl-md' : 'hl-as');
  const joiner = node.op==='^' ? OPSYM[node.op] : ` ${OPSYM[node.op]} `;
  let text = `<span class="${cls}">${l.text}${joiner}${r.text}</span>`;
  const needsParen = node.paren || (myPrec < parentPrec) || (myPrec===parentPrec && isRightChildOfSamePrec && (node.op==='-'||node.op==='/'));
  if(needsParen){ text = `<span class="hl-paren">(</span>${text}<span class="hl-paren">)</span>`; }
  return {text, cls};
}

/* ---------- BODMAS generator (integers) ---------- */
function genBodmasTree(level){
  const nums = ()=>randInt(2,12);
  if(level===1){
    const op = choice(['+','-','*','/']);
    let a=nums(), b=nums();
    if(op==='/'){ b=randInt(2,6); a=b*randInt(2,9); }
    if(op==='-'){ if(a<b)[a,b]=[b,a]; }
    return {type:'op', op, left:{type:'num',val:F(a)}, right:{type:'num',val:F(b)}};
  }
  if(level===2){
    // three numbers, one high-prec pair + one low-prec, no explicit parens
    const shape = choice(['a+bxc','axb+c','a-bxc','axb-c','a+b/c','a/b+c']);
    let a=randInt(1,10), b=randInt(1,9), c=randInt(1,9);
    if(shape.includes('/')){
      if(shape==='a+b/c'||shape==='a-b/c'){ c=randInt(2,6); b=c*randInt(1,6);} 
      else { b=randInt(2,6); a=b*randInt(1,6); }
    }
    const mkMul=(x,y)=>({type:'op',op:choice(['*','*','/']===undefined?'*':'*'),left:{type:'num',val:F(x)},right:{type:'num',val:F(y)}});
    if(shape==='a+bxc') return {type:'op',op:'+',left:{type:'num',val:F(a)},right:{type:'op',op:'*',left:{type:'num',val:F(b)},right:{type:'num',val:F(c)}}};
    if(shape==='axb+c') return {type:'op',op:'+',left:{type:'op',op:'*',left:{type:'num',val:F(a)},right:{type:'num',val:F(b)}},right:{type:'num',val:F(c)}};
    if(shape==='a-bxc') return {type:'op',op:'-',left:{type:'num',val:F(a+b*c)},right:{type:'op',op:'*',left:{type:'num',val:F(b)},right:{type:'num',val:F(c)}}};
    if(shape==='axb-c') return {type:'op',op:'-',left:{type:'op',op:'*',left:{type:'num',val:F(a)},right:{type:'num',val:F(b)}},right:{type:'num',val:F(c)}};
    if(shape==='a+b/c') return {type:'op',op:'+',left:{type:'num',val:F(a)},right:{type:'op',op:'/',left:{type:'num',val:F(b)},right:{type:'num',val:F(c)}}};
    return {type:'op',op:'+',left:{type:'op',op:'/',left:{type:'num',val:F(a)},right:{type:'num',val:F(b)}},right:{type:'num',val:F(c)}};
  }
  if(level===3){
    // explicit parens forcing addition/subtraction before multiplication
    let a=randInt(2,10), b=randInt(1,9), c=randInt(2,9);
    const shape = choice(['(a+b)xc','cx(a+b)','(a-b)xc','(a+b)/c']);
    if(shape==='(a+b)/c'){ c=randInt(2,6); const sum=c*randInt(2,7); a=randInt(1,sum-1); b=sum-a; }
    const parenNode = {type:'op',op:shape.includes('-')?'-':'+',left:{type:'num',val:F(a)},right:{type:'num',val:F(b)},paren:true};
    if(shape==='(a+b)xc'||shape==='(a-b)xc') return {type:'op',op:'*',left:parenNode,right:{type:'num',val:F(c)}};
    if(shape==='cx(a+b)') return {type:'op',op:'*',left:{type:'num',val:F(c)},right:parenNode};
    return {type:'op',op:'/',left:parenNode,right:{type:'num',val:F(c)}};
  }
  if(level===4){
    // 4-5 terms mixing parens and precedence, one small exponent
    const a=randInt(2,6), sq=choice([2,3]);
    const b=randInt(2,9), c=randInt(2,9), d=randInt(2,9);
    const powNode = {type:'op',op:'^',left:{type:'num',val:F(a)},right:{type:'num',val:F(sq)}};
    const parenNode = {type:'op',op:choice(['+','-']),left:{type:'num',val:F(b)},right:{type:'num',val:F(c)},paren:true};
    const mulNode = {type:'op',op:'*',left:parenNode,right:{type:'num',val:F(d)}};
    return {type:'op',op:choice(['+','-']),left:powNode,right:mulNode};
  }
  // level 5: nested parentheses
  const a=randInt(2,8), b=randInt(2,8), c=randInt(2,6), d=randInt(2,8), e=randInt(2,6);
  const inner = {type:'op',op:choice(['+','-']),left:{type:'num',val:F(a)},right:{type:'num',val:F(b)},paren:true};
  const midMul = {type:'op',op:'*',left:inner,right:{type:'num',val:F(c)}};
  const outer = {type:'op',op:choice(['+','-']),left:midMul,right:{type:'num',val:F(d)},paren:true};
  return {type:'op',op:'/',left:outer,right:{type:'num',val:F(gcdSafeDivisor(outer))}};

  function gcdSafeDivisor(){ return e; }
}

/* ---------- Fractions+BODMAS generator ---------- */
function randFrac(maxD=8){ const d=choice([2,3,4,5,6,8].filter(x=>x<=maxD)); const n=randInt(1,d*2); return F(n,d); }
function genFracBodmasTree(level){
  const nf=()=>randFrac(level<=2?6:8);
  if(level===1){
    const op=choice(['+','-','*','/']);
    let a=nf(), b=nf();
    if(op==='-' && a.toFloat()<b.toFloat()) [a,b]=[b,a];
    return {type:'op',op,left:{type:'num',val:a},right:{type:'num',val:b}};
  }
  if(level===2){
    const a=nf(), b=nf(), c=nf();
    const shape=choice(['a+bxc','axb+c','a-bxc']);
    if(shape==='a+bxc') return {type:'op',op:'+',left:{type:'num',val:a},right:{type:'op',op:'*',left:{type:'num',val:b},right:{type:'num',val:c}}};
    if(shape==='axb+c') return {type:'op',op:'+',left:{type:'op',op:'*',left:{type:'num',val:a},right:{type:'num',val:b}},right:{type:'num',val:c}};
    return {type:'op',op:'-',left:{type:'num',val:a.add(b.mul(c))},right:{type:'op',op:'*',left:{type:'num',val:b},right:{type:'num',val:c}}};
  }
  if(level===3){
    const a=nf(), b=nf(), c=nf();
    const parenNode={type:'op',op:choice(['+','-']),left:{type:'num',val:a},right:{type:'num',val:b},paren:true};
    return {type:'op',op:choice(['*','/']),left:parenNode,right:{type:'num',val:c}};
  }
  if(level===4){
    const whole=randInt(1,4), n=randInt(1,4), d=randInt(2,6);
    const mixed = F(whole*d+n, d);
    const c=nf(), e=nf();
    const parenNode={type:'op',op:'+',left:{type:'num',val:mixed},right:{type:'num',val:c},paren:true};
    return {type:'op',op:choice(['*','/']),left:parenNode,right:{type:'num',val:e}};
  }
  const a=nf(), b=nf(), c=nf(), d=nf();
  const inner={type:'op',op:choice(['+','-']),left:{type:'num',val:a},right:{type:'num',val:b},paren:true};
  const mul={type:'op',op:'*',left:inner,right:{type:'num',val:c}};
  return {type:'op',op:choice(['+','-']),left:mul,right:{type:'num',val:d},paren:true};
}

/* ============================================================
   PLAIN-FRACTIONS generator (visual model stage)
   ============================================================ */
function genFractionProblem(level){
  if(level===1){
    // simplify / identify a fraction
    const d0=choice([4,6,8,9,10,12]);
    const mult=randInt(2,4);
    const n=randInt(1,d0-1)*mult, d=d0*mult;
    const target=F(n,d);
    return {
      kind:'simplify',
      prompt:`Reduce <span class="mono">${n}/${d}</span> to simplest form.`,
      visual:v=>fracBarSVG(n,d,'#1F5C52'),
      answer:target,
      steps:[{left:`${n}/${d}`, op:'÷ gcd', right:String(gcd(n,d)), result:target.toString(), cls:'as'}]
    };
  }
  if(level===2){
    const d=choice([4,5,6,8,9,10,12]);
    let n1=randInt(1,d-1), n2=randInt(1,d-1);
    const op=choice(['+','-']);
    if(op==='-' && n1<n2)[n1,n2]=[n2,n1];
    const a=F(n1,d), b=F(n2,d);
    const res = op==='+'? a.add(b): a.sub(b);
    return {
      kind:'samedenom',
      prompt:`<span class="mono">${n1}/${d} ${op} ${n2}/${d}</span> = ?`,
      visual:()=>fracPairSVG(n1,d,n2,d,op),
      answer:res,
      steps:[{left:`${n1}/${d}`,op,right:`${n2}/${d}`,result:res.toMixedString(),cls:'as'}]
    };
  }
  if(level===3){
    const d1=choice([2,3,4,5]), d2=choice([3,4,5,6].filter(x=>x!==d1));
    const n1=randInt(1,d1-1), n2=randInt(1,d2-1);
    const op=choice(['+','-']);
    const a=F(n1,d1), b=F(n2,d2);
    let res = op==='+'? a.add(b): a.sub(b);
    if(op==='-' && a.toFloat()<b.toFloat()){ res=b.sub(a); }
    const l = op==='-' && a.toFloat()<b.toFloat() ? {n:n2,d:d2} : {n:n1,d:d1};
    const r = op==='-' && a.toFloat()<b.toFloat() ? {n:n1,d:d1} : {n:n2,d:d2};
    const lcd = (l.d*r.d)/gcd(l.d,r.d);
    return {
      kind:'diffdenom',
      prompt:`<span class="mono">${l.n}/${l.d} ${op} ${r.n}/${r.d}</span> = ?`,
      visual:()=>fracPairSVG(l.n,l.d,r.n,r.d,op),
      answer:res,
      steps:[
        {left:`${l.n}/${l.d}`,op:'→ LCD',right:String(lcd),result:`${l.n*(lcd/l.d)}/${lcd}`,cls:'md'},
        {left:`${r.n}/${r.d}`,op:'→ LCD',right:String(lcd),result:`${r.n*(lcd/r.d)}/${lcd}`,cls:'md'},
        {left:`${l.n*(lcd/l.d)}/${lcd}`,op,right:`${r.n*(lcd/r.d)}/${lcd}`,result:res.toMixedString(),cls:'as'}
      ]
    };
  }
  if(level===4){
    const d1=choice([2,3,4,5,6]), d2=choice([2,3,4,5,6]);
    const n1=randInt(1,d1*2-1), n2=randInt(1,d2-1);
    const op=choice(['*','/']);
    const a=F(n1,d1), b=F(n2,d2);
    const res = op==='*'? a.mul(b) : a.div(b);
    return {
      kind:'muldiv',
      prompt:`<span class="mono">${n1}/${d1} ${op==='*'?'×':'÷'} ${n2}/${d2}</span> = ?`,
      visual: op==='*' ? ()=>fracAreaSVG(n1,d1,n2,d2) : ()=>fracPairSVG(n1,d1,n2,d2,'/'),
      answer:res,
      steps:[{left:`${n1}/${d1}`,op:op==='*'?'×':'÷ → ×recip',right:`${n2}/${d2}`,result:res.toMixedString(),cls:'md'}]
    };
  }
  // level 5: mixed numbers
  const w1=randInt(1,3), d1=randInt(2,6), n1=randInt(1,d1-1);
  const w2=randInt(1,3), d2=randInt(2,6), n2=randInt(1,d2-1);
  const op=choice(['+','-','*']);
  const a=F(w1*d1+n1,d1), b=F(w2*d2+n2,d2);
  let res;
  let A=a,B=b;
  if(op==='-' && a.toFloat()<b.toFloat()){A=b;B=a;}
  res = op==='+'? A.add(B): op==='-'? A.sub(B): a.mul(b);
  const lbl = op==='*' ? `${w1} ${n1}/${d1} × ${w2} ${n2}/${d2}` : `${A===a?w1+' '+n1+'/'+d1:w2+' '+n2+'/'+d2} ${op} ${A===a?w2+' '+n2+'/'+d2:w1+' '+n1+'/'+d1}`;
  return {
    kind:'mixed',
    prompt:`<span class="mono">${lbl}</span> = ?`,
    visual:()=>fracPairSVG(A.n,A.d,B.n,B.d,op==='*'?'*':op),
    answer:res,
    steps:[{left:A.toMixedString(),op,right:B.toMixedString(),result:res.toMixedString(),cls:'as'}]
  };
}

/* ---------- SVG fraction visuals ---------- */
function fracBarSVG(n,d,color){
  const w=280,h=44,segW=w/d;
  let rects='';
  for(let i=0;i<d;i++){
    const filled = i<n;
    rects+=`<rect x="${i*segW}" y="0" width="${segW}" height="${h}" fill="${filled?color:'#fff'}" stroke="#C9D3CB" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${rects}</svg>`;
}
function fracPairSVG(n1,d1,n2,d2,op){
  const w=240,h=40,gap=26;
  const bar=(n,d,color,y)=>{
    const segW=w/d; let r='';
    for(let i=0;i<d;i++) r+=`<rect x="${i*segW}" y="${y}" width="${segW}" height="${h}" fill="${i<n?color:'#fff'}" stroke="#C9D3CB" stroke-width="1.5"/>`;
    return r;
  };
  const label=(t,y)=>`<text x="-8" y="${y+h/2+5}" text-anchor="end" font-family="Space Mono" font-size="14" fill="#4A5D5F">${t}</text>`;
  const opSym = op==='+'?'+':op==='-'?'−':op==='*'?'×':'÷';
  let svg = `<svg viewBox="-70 -6 ${w+90} ${h*2+gap+30}" width="${w+90}" height="${h*2+gap+30}">`;
  svg += bar(n1,d1,'#1F5C52',0);
  svg += `<text x="${w/2}" y="${h+20}" text-anchor="middle" font-family="Space Mono" font-size="18" fill="#D98E2B">${opSym}</text>`;
  svg += bar(n2,d2,'#5B4B8A',h+gap);
  svg += label(`${n1}/${d1}`,0);
  svg += label(`${n2}/${d2}`,h+gap);
  svg += `</svg>`;
  return svg;
}
function fracAreaSVG(n1,d1,n2,d2){
  const size=180, cw=size/d1, rh=size/d2;
  let cells='';
  for(let r=0;r<d2;r++){
    for(let c=0;c<d1;c++){
      const inRegion = c<n1 && r<n2;
      cells+=`<rect x="${c*cw}" y="${r*rh}" width="${cw}" height="${rh}" fill="${inRegion?'#D98E2B':'#fff'}" fill-opacity="${inRegion?0.85:1}" stroke="#C9D3CB" stroke-width="1"/>`;
    }
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${cells}<rect x="0" y="0" width="${size}" height="${size}" fill="none" stroke="#182B2E" stroke-width="2"/></svg>`;
}

/* ============================================================
   LINEAR ALGEBRA generator
   ============================================================ */
function fmtLin(coef, cons){
  let s = coef===1?'x': coef===-1?'-x': `${coef}x`;
  if(cons>0) s+= ` + ${cons}`;
  else if(cons<0) s+= ` − ${-cons}`;
  return s;
}
function fmtSigned(n){ return n>=0? `+ ${n}` : `− ${-n}`; }
function genLinearProblem(level){
  if(level===1){
    const a=randInt(1,20), x=randInt(-10,10);
    const op=choice(['+','-']);
    const b = op==='+'? x+a : x-a;
    return {
      kind:'onestep',
      prompt: op==='+' ? `x + ${a} = ${b}` : `x − ${a} = ${b}`,
      visual:()=>balanceSVG(`x ${op} ${a}`, `${b}`),
      answer:F(x),
      steps:[
        {left:`x ${op} ${a}`, op:'both sides', right: op==='+'?`− ${a}`:`+ ${a}`, result:`x = ${x}`, cls:'as'}
      ]
    };
  }
  if(level===2){
    const a=randInt(2,9), x=randInt(-8,8), b=randInt(-15,15);
    const c=a*x+b;
    return {
      kind:'twostep',
      prompt:`${fmtLin(a,b)} = ${c}`,
      visual:()=>balanceSVG(fmtLin(a,b), `${c}`),
      answer:F(x),
      steps:[
        {left:fmtLin(a,b), op:fmtSigned(-b), right:'', result:`${a}x = ${c-b}`, cls:'as'},
        {left:`${a}x`, op:'÷ '+a, right:`${a}`, result:`x = ${x}`, cls:'md'}
      ]
    };
  }
  if(level===3){
    const a=randInt(3,8), c=randInt(1,a-1);
    const x=randInt(-8,8);
    const b=randInt(-10,10);
    const d = (a-c)*x+b; // c*x+d = a*x+b  => solve
    return {
      kind:'bothsides',
      prompt:`${fmtLin(a,b)} = ${fmtLin(c,d)}`,
      visual:()=>balanceSVG(fmtLin(a,b), fmtLin(c,d)),
      answer:F(x),
      steps:[
        {left:fmtLin(a,b), op:`− ${c===1?'x':c+'x'}`, right:fmtLin(c,d), result:`${fmtLin(a-c,b)} = ${d}`, cls:'as'},
        {left:fmtLin(a-c,b), op:fmtSigned(-b), right:'', result:`${a-c===1?'x':(a-c)+'x'} = ${d-b}`, cls:'as'},
        {left:`${a-c}x`, op:'÷ '+(a-c), right:`${a-c}`, result:`x = ${x}`, cls:'md'}
      ]
    };
  }
  if(level===4){
    const a=randInt(2,6), b=randInt(1,8), x=randInt(-6,6);
    const c=a*(x+b);
    return {
      kind:'distribute',
      prompt:`${a}(x + ${b}) = ${c}`,
      visual:()=>balanceSVG(`${a}(x + ${b})`, `${c}`),
      answer:F(x),
      steps:[
        {left:`${a}(x + ${b})`, op:'distribute', right:'', result:`${a}x + ${a*b} = ${c}`, cls:'md'},
        {left:`${a}x + ${a*b}`, op:'− '+(a*b), right:`${c}`, result:`${a}x = ${c-a*b}`, cls:'as'},
        {left:`${a}x`, op:'÷ '+a, right:`${a}`, result:`x = ${x}`, cls:'md'}
      ]
    };
  }
  // level 5: slope from two points, then evaluate y at a given x
  let x1=randInt(-6,6), x2=randInt(-6,6);
  while(x2===x1) x2=randInt(-6,6);
  const m = randInt(-4,4)||2;
  const y1=randInt(-6,6);
  const y2=y1+m*(x2-x1);
  const b = y1 - m*x1;
  const testX = randInt(-5,5);
  const testY = m*testX+b;
  return {
    kind:'slope',
    prompt:`Line through (${x1}, ${y1}) and (${x2}, ${y2}). Find y when x = ${testX}.`,
    visual:()=>lineGraphSVG(x1,y1,x2,y2,testX,testY),
    answer:F(testY),
    steps:[
      {left:`m = (y₂−y₁)/(x₂−x₁)`, op:'=', right:`(${y2}−${y1})/(${x2}−${x1})`, result:`m = ${m}`, cls:'md'},
      {left:`y = mx + b`, op:'solve b using', right:`(${x1},${y1})`, result:`b = ${b}`, cls:'as'},
      {left:`y = ${m}x + ${b}`, op:'x = '+testX, right:'', result:`y = ${testY}`, cls:'as'}
    ]
  };
}
function balanceSVG(left,right){
  const w=360,h=140;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <line x1="${w/2}" y1="20" x2="${w/2}" y2="70" stroke="#182B2E" stroke-width="4"/>
    <line x1="40" y1="50" x2="${w-40}" y2="50" stroke="#182B2E" stroke-width="4"/>
    <line x1="40" y1="50" x2="40" y2="85" stroke="#4A5D5F" stroke-width="2"/>
    <line x1="${w-40}" y1="50" x2="${w-40}" y2="85" stroke="#4A5D5F" stroke-width="2"/>
    <path d="M10,85 L70,85 L60,105 L20,105 Z" fill="#EEF2EE" stroke="#182B2E" stroke-width="2"/>
    <path d="M${w-70},85 L${w-10},85 L${w-20},105 L${w-60},105 Z" fill="#EEF2EE" stroke="#182B2E" stroke-width="2"/>
    <text x="40" y="98" text-anchor="middle" font-family="Space Mono" font-size="15" fill="#182B2E">${left}</text>
    <text x="${w-40}" y="98" text-anchor="middle" font-family="Space Mono" font-size="15" fill="#182B2E">${right}</text>
    <circle cx="${w/2}" cy="20" r="6" fill="#D98E2B"/>
    <line x1="15" y1="20" x2="${w-15}" y2="20" stroke="#4A5D5F" stroke-width="1" stroke-dasharray="2 3"/>
  </svg>`;
}
function lineGraphSVG(x1,y1,x2,y2,tx,ty){
  const w=280,h=280,pad=28,scale=18,cx=w/2,cy=h/2;
  const px=(x)=>cx+x*scale, py=(y)=>cy-y*scale;
  let grid='';
  for(let i=-7;i<=7;i++){
    grid+=`<line x1="${px(i)}" y1="0" x2="${px(i)}" y2="${h}" stroke="#E2E7E2" stroke-width="1"/>`;
    grid+=`<line x1="0" y1="${py(i)}" x2="${w}" y2="${py(i)}" stroke="#E2E7E2" stroke-width="1"/>`;
  }
  const m=(y2-y1)/(x2-x1);
  const yAtLeft = y1+m*(-7-x1), yAtRight=y1+m*(7-x1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    ${grid}
    <line x1="0" y1="${cy}" x2="${w}" y2="${cy}" stroke="#182B2E" stroke-width="1.5"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${h}" stroke="#182B2E" stroke-width="1.5"/>
    <line x1="${px(-7)}" y1="${py(yAtLeft)}" x2="${px(7)}" y2="${py(yAtRight)}" stroke="#1F5C52" stroke-width="2.5"/>
    <circle cx="${px(x1)}" cy="${py(y1)}" r="5" fill="#5B4B8A"/>
    <circle cx="${px(x2)}" cy="${py(y2)}" r="5" fill="#5B4B8A"/>
    <circle cx="${px(tx)}" cy="${py(ty)}" r="6" fill="#D98E2B" stroke="#182B2E" stroke-width="1.5"/>
  </svg>`;
}

/* ============================================================
   STAGE DEFINITIONS
   ============================================================ */
const STAGES = [
  {
    id:'bodmas', name:'Basic BODMAS', short:'Order of operations',
    lesson:`<b>BODMAS</b> tells you which operation to do first: <b>B</b>rackets, <b>O</b>rders (powers), <b>D</b>ivision & <b>M</b>ultiplication (left→right), <b>A</b>ddition & <b>S</b>ubtraction (left→right). Work the highlighted part first — <span class="hl-paren mono">brackets</span>, then <span class="hl-md mono">×÷</span>, then <span class="hl-as mono">+−</span>.`,
    legend:[['paren','Brackets / powers'],['md','× ÷'],['as','+ −']],
    gen: (lvl)=>{
      const tree=genBodmasTree(lvl);
      const steps=[]; const answer=evalTree(tree,steps);
      const rendered=renderInfix(tree,0,false).text;
      return {prompt:`${rendered} = ?`, answer, steps, visual:null};
    }
  },
  {
    id:'fractions', name:'Basic Fractions', short:'Bars, add, multiply',
    lesson:`A fraction is <i>parts shaded</i> out of <i>total parts</i>. Same denominators add straight across. Different denominators need a common denominator first. Multiplying fractions multiplies straight across — think "area of a rectangle."`,
    legend:[['as','same denominator'],['md','LCD / × ÷']],
    gen:(lvl)=>{
      const p = genFractionProblem(lvl);
      return {prompt:p.prompt, answer:p.answer, steps:p.steps, visual:p.visual};
    }
  },
  {
    id:'fracbodmas', name:'Fractions + BODMAS', short:'Combine both skills',
    lesson:`Same BODMAS rules — now the numbers are fractions. Do <span class="hl-paren mono">brackets</span> first, then <span class="hl-md mono">× ÷</span>, then <span class="hl-as mono">+ −</span>. Keep every intermediate answer reduced to simplest form.`,
    legend:[['paren','Brackets'],['md','× ÷'],['as','+ −']],
    gen:(lvl)=>{
      const tree=genFracBodmasTree(lvl);
      const steps=[]; const answer=evalTree(tree,steps);
      const rendered=renderInfix(tree,0,false).text;
      return {prompt:`${rendered} = ?`, answer, steps, visual:null};
    }
  },
  {
    id:'linear', name:'Linear Algebra', short:'Solve for x, read lines',
    lesson:`To solve for <span class="mono">x</span>, do the <i>same operation to both sides</i> until x is alone — like keeping a balance scale level. For lines, slope <span class="mono">m = (y₂−y₁)/(x₂−x₁)</span> tells you the steepness.`,
    legend:[['as','add / subtract both sides'],['md','multiply / divide both sides']],
    gen:(lvl)=>{
      const p=genLinearProblem(lvl);
      return {prompt:p.prompt, answer:p.answer, steps:p.steps, visual:p.visual};
    }
  }
];
const LEVEL_NAMES=['Level 1','Level 2','Level 3','Level 4','Level 5'];
const MASTER_STREAK = 4;

/* ============================================================
   STATE + PERSISTENCE
   ============================================================ */
let progress = STAGES.map(()=>({levels:[false,false,false,false,false], streaks:[0,0,0,0,0], current:0}));
let screen = {name:'map'};
let currentProblem = null;
let lastAnswered = false;

async function loadProgress(){
  try{
    const res = await window.storage.get('workshop-progress');
    if(res && res.value){
      const saved = JSON.parse(res.value);
      if(Array.isArray(saved) && saved.length===STAGES.length) progress = saved;
    }
  }catch(e){ /* no saved progress yet */ }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('workshop-progress', JSON.stringify(progress)); }catch(e){}
}

function stageMastered(si){ return progress[si].levels.every(v=>v); }
function stageUnlocked(si){ return si===0 || stageMastered(si-1); }
function overallPercent(){
  let done=0; STAGES.forEach((s,i)=>progress[i].levels.forEach(v=>{if(v)done++;}));
  return Math.round(done/(STAGES.length*5)*100);
}

/* ============================================================
   RENDERING
   ============================================================ */
const app = document.getElementById('app');

function render(){
  if(screen.name==='map') renderMap();
  else renderStage();
}

function renderMap(){
  const pct = overallPercent();
  const isMobile = window.innerWidth <= 640;
  let nodesHTML='';
  const colors=['#1F5C52','#5B4B8A','#D98E2B','#B8443B'];

  let viewBox, positions, nodeR, labelSize, subSize, labelY, subY;
  if(isMobile){
    viewBox = '0 0 340 920';
    positions = [ {x:110,y:80}, {x:250,y:300}, {x:110,y:520}, {x:250,y:740} ];

  } else {
    viewBox = '0 0 920 260';
    positions = [ {x:80,y:70}, {x:340,y:150}, {x:600,y:70}, {x:820,y:180} ];
    nodeR = 42; labelSize = 15; subSize = 11; labelY = 70; subY = 88;
  }

  let pathD = `M ${positions[0].x} ${positions[0].y}`;
  for(let i=1;i<positions.length;i++){
    const p0=positions[i-1], p1=positions[i];
    if(isMobile){
      pathD += ` Q ${p1.x + (i%2? -90:90)} ${(p0.y+p1.y)/2}, ${p1.x} ${p1.y}`;
    } else {
      pathD += ` Q ${(p0.x+p1.x)/2} ${p1.y+(i%2?50:-50)}, ${p1.x} ${p1.y}`;
    }
  }
  STAGES.forEach((s,i)=>{
    const unlocked = stageUnlocked(i);

    const doneCount = progress[i].levels.filter(v=>v).length;
    const pos=positions[i];
    nodesHTML += `
      <g class="node ${unlocked?'':'locked'}" data-stage="${i}" transform="translate(${pos.x},${pos.y})">
        <circle class="node-circle" r="${nodeR}" fill="${unlocked? (mastered?colors[i]:'#fff') : '#E2E7E2'}" stroke="${unlocked?colors[i]:'#C9D3CB'}" stroke-width="4"/>
        ${mastered?`<text x="0" y="7" text-anchor="middle" font-size="26" fill="white">✓</text>`:
          unlocked?`<text x="0" y="7" text-anchor="middle" font-family="Space Mono" font-size="15" fill="${colors[i]}">${doneCount}/5</text>`:
          `<text x="0" y="8" text-anchor="middle" font-size="20" fill="#8a958f">🔒</text>`}
        <text class="node-label" x="0" y="${labelY}" text-anchor="middle" font-size="${labelSize}" fill="${unlocked?'#182B2E':'#9aa79f'}">${s.name}</text>
        <text class="node-sub" x="0" y="${subY}" text-anchor="middle" font-size="${subSize}" fill="#7c8c86">${s.short}</text>
      </g>`;
  });

  app.innerHTML = `
    <div class="top">
      <div>
        <div class="brand">The Number <span>Workshop</span></div>
        <div class="tagline">Zero to mastery: BODMAS → fractions → fractions with BODMAS → linear algebra.</div>
      </div>
      <div class="overall">
        <span>${pct}% mastered</span>
        <div class="overall-track"><div class="overall-fill" style="width:${pct}%"></div></div>
      </div>
    </div>
    <div class="path-wrap">
      <svg class="path-svg" viewBox="${viewBox}" style="${isMobile?'max-width:360px;margin:0 auto;display:block;':''}">
        <path d="${pathD}" fill="none" stroke="#C9D3CB" stroke-width="3" stroke-dasharray="1 10" stroke-linecap="round"/>
        ${nodesHTML}
      </svg>
    </div>
    <div class="panel">
      <div class="lesson-title">How mastery works</div>
      <div class="lesson-body">Each topic has 5 levels. Answer ${MASTER_STREAK} in a row correctly to master a level and unlock the next. Master all 5 levels to unlock the next topic on the path. Your progress is saved automatically.</div>
    </div>
    <footer class="note">Built for going from absolute zero to confident and fast.</footer>
  `;

  app.querySelectorAll('.node').forEach(el=>{
    el.addEventListener('click', ()=>{
      const si = parseInt(el.dataset.stage,10);
      if(!stageUnlocked(si)) return;
      screen = {name:'stage', stageIdx:si};
      currentProblem=null;
      render();
    });
  });
}

  const stage = STAGES[si];

    currentProblem = stage.gen(lvl+1);
    lastAnswered=false;
  }

  const pipsHTML = st.levels.map((done,i)=>{
    const cls = done?'done':(i===lvl?'active':'');
    return `<div class="pip ${cls}">${done?'✓':i+1}</div>`;
  }).join('');

  const legendHTML = stage.legend.map(([cls,label])=>`<div class="legend-item"><span class="legend-dot tag-${cls}" style="background:${cls==='paren'?'#5B4B8A':cls==='md'?'#D98E2B':'#1F5C52'}"></span>${label}</div>`).join('');

  let bodyHTML='';
  if(mastered){
    bodyHTML = `
      <div class="mastery-banner">
        <h2>🏆 ${stage.name} — Mastered</h2>
        <p>You cleared every level with a ${MASTER_STREAK}-in-a-row streak. Keep sharp with more practice, or move to the next stage on the path.</p>
        <button class="btn secondary" id="practice-more">Practice anyway</button>
        <button class="btn" id="go-map" style="margin-left:8px;">Back to path</button>
      </div>`;
  } else {
    const visualHTML = currentProblem.visual ? `<div class="visual-box">${currentProblem.visual()}</div>` : '';
    bodyHTML = `
      <div class="problem-count">${LEVEL_NAMES[lvl]} · streak ${st.streaks[lvl]}/${MASTER_STREAK} to master</div>
      <div class="prompt">${currentProblem.prompt}</div>
      ${visualHTML}
      <div class="answer-row">
        <input class="answer-input mono" id="ans-input" type="text" placeholder="${stage.id==='linear'?'x = ?':'answer'}" autocomplete="off" ${lastAnswered?'disabled':''}/>
        <button class="btn" id="check-btn" ${lastAnswered?'disabled':''}>Check</button>
        <button class="btn secondary" id="skip-btn">Skip</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="streak-row">
        <div class="streak-fire">🔥 ${st.streaks[lvl]}</div>
        <div class="streak-track"><div class="streak-fill" style="width:${Math.min(100, st.streaks[lvl]/MASTER_STREAK*100)}%"></div></div>
        <span>${st.streaks[lvl]}/${MASTER_STREAK} correct in a row</span>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← Path</button>
      <div class="stage-title">${stage.name}</div>
      <div class="level-pips">${pipsHTML}</div>
    </div>
    <div class="panel">
      <div class="lesson-title">Quick refresher</div>
      <div class="lesson-body">${stage.lesson}</div>
      <div class="legend">${legendHTML}</div>
    </div>
    <div class="panel">${bodyHTML}</div>
  `;

  app.querySelector('#back-btn').addEventListener('click', ()=>{ screen={name:'map'}; render(); });
  const goMap = app.querySelector('#go-map'); if(goMap) goMap.addEventListener('click', ()=>{ screen={name:'map'}; render(); });
  const practiceMore = app.querySelector('#practice-more'); if(practiceMore) practiceMore.addEventListener('click', ()=>{ st.current=0; currentProblem=null; render(); });

  const checkBtn = app.querySelector('#check-btn');
  const input = app.querySelector('#ans-input');
  if(checkBtn){
    checkBtn.addEventListener('click', ()=>checkAnswer(si));
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkAnswer(si); });
    input.focus();
  }
  const skipBtn = app.querySelector('#skip-btn');
  if(skipBtn) skipBtn.addEventListener('click', ()=>{
    st.streaks[lvl]=0;
    currentProblem=null;
    render();
  });
}

function checkAnswer(si){
  if(lastAnswered) return;
  const st = progress[si];
  const lvl = st.current;
  const input = document.getElementById('ans-input');
  const parsed = parseAnswer(input.value);
  const fb = document.getElementById('feedback');
  const correct = parsed && parsed.n===currentProblem.answer.n && parsed.d===currentProblem.answer.d;
  lastAnswered = true;
  input.disabled=true;
  document.getElementById('check-btn').disabled=true;

  const stepsHTML = currentProblem.steps.map(s=>
    `<span class="step"><span class="tag ${s.cls}">${s.cls==='paren'?'brackets':s.cls==='md'?'×÷':'+−'}</span>${s.left} ${s.op} ${s.right} = <b>${s.result}</b></span>`
  ).join('');

  if(correct){
    st.streaks[lvl]++;
    fb.className='feedback show correct';
    fb.innerHTML = `<b>Correct.</b> ${currentProblem.answer.toMixedString ? '' : ''}<div class="steps">${stepsHTML}</div>`;
    if(st.streaks[lvl] >= MASTER_STREAK){
      st.levels[lvl]=true;
      if(lvl < 4){ st.current = lvl+1; }
      fb.innerHTML += `<div style="margin-top:10px;font-weight:700;color:#1c5c3e;">Level mastered! ${lvl<4?'Moving to '+LEVEL_NAMES[lvl+1]+'.':'Stage complete.'}</div>`;
    }
  } else {
    st.streaks[lvl]=0;
    fb.className='feedback show wrong';
    fb.innerHTML = `<b>Not quite.</b> The answer is <b>${currentProblem.answer.toMixedString()}</b>.<div class="steps">${stepsHTML}</div>`;
  }
  saveProgress();

  const row = fb.parentElement;
  let nextBtn = document.createElement('button');
  nextBtn.className='btn';
  nextBtn.style.marginTop='14px';
  nextBtn.textContent='Next problem →';
  nextBtn.addEventListener('click', ()=>{ currentProblem=null; render(); });
  fb.after(nextBtn);
}

loadProgress();

let _lastLayoutMobile = window.innerWidth <= 640;
let _resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(()=>{
    const nowMobile = window.innerWidth <= 640;
    if(nowMobile !== _lastLayoutMobile){
      _lastLayoutMobile = nowMobile;
      if(screen.name==='map') render();
    }
  }, 150);
});
</script>
</body>
</html>
